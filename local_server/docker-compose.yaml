services:
  grafana:
    image: grafana/grafana:latest
    container_name: calendar-heatmap-dev
    ports:
      - "3000:3000"
    volumes:
      - ../dist:/var/lib/grafana/plugins/tim012432-calendarheatmap-panel
      - ../provisioning:/etc/grafana/provisioning
    environment:
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: tim012432-calendarheatmap-panel
      GF_DEFAULT_APP_MODE: development
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_BASIC_ENABLED: "false"
      GF_LOG_LEVEL: debug
      GF_LOG_FILTERS: plugin.tim012432-calendarheatmap-panel:debug
    restart: unless-stopped